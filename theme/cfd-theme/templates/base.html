<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% if title %}
        <title>{{ title }} — {{ SITENAME }}</title>
    {% else %}
        <title>{{ SITENAME }}</title>
    {% endif %}

    {% if description %}
        <meta name="description" content="{{ description }}">
    {% endif %}

    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
</head>

<script>
window.MathJax = {
  tex: {
    inlineMath: [
      ['\\(', '\\)'],
      ['$', '$']
    ],
    displayMath: [
      ['\\[', '\\]'],
      ['$$', '$$']
    ]
  }
};
</script>

<script async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>


<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <a class="brand" href="{{ SITEURL }}/">
                <span class="brand-mark">∿</span>
                <span>{{ AUTHOR }}</span>
            </a>

            <nav class="navigation">

                <!-- Home -->
                <a href="{{ SITEURL }}/"
                   class="{% if output_file == 'index.html' %}active{% endif %}">
                    Home
                </a>

                <!-- Blog -->
                <a href="{{ SITEURL }}/pages/blog.html"
                   class="{% if page and page.slug == 'blog' %}active{% elif article and article.category == 'Blog' %}active{% endif %}">
                    Blogs
                </a>

                <!-- CFD Cases -->
                <a href="{{ SITEURL }}/pages/cases.html"
                   class="{% if page and page.slug == 'cases' %}active{% elif article and article.category == 'CFD Cases' %}active{% endif %}">
                    CFD Cases
                </a>

                <!-- About -->
                <a href="{{ SITEURL }}/pages/about.html"
                   class="{% if page and page.slug == 'about' %}active{% endif %}">
                    About
                </a>

            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>© {{ AUTHOR }} {{ CURRENTYEAR }}.</p>
            <p>Computational Fluid Dynamics · Engineering · Python</p>
        </div>
    </footer>

    <script src="{{ SITEURL }}/theme/js/main.js"></script>
</body>
</html>
